<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Confirmación de Datos de Envío</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --border-color: #e2e8f0;
      --focus-ring: rgba(37, 99, 235, 0.2);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      background: var(--bg-gradient);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px 12px;
    }

    .card {
      background: var(--card-bg);
      width: 100%;
      max-width: 480px;
      border-radius: 20px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
      overflow: hidden;
      animation: fadeIn 0.4s ease-out;
      position: relative;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .card-header {
      background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
      color: white;
      padding: 28px 24px;
      text-align: center;
    }

    .card-header h2 {
      font-size: 22px;
      font-weight: 800;
      margin-bottom: 6px;
    }

    .card-header p {
      font-size: 13px;
      color: #93c5fd;
    }

    .card-body {
      padding: 24px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 6px;
      text-transform: uppercase;
    }

    input, select {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid var(--border-color);
      border-radius: 10px;
      font-size: 14px;
      color: var(--text-main);
      background-color: #f8fafc;
      transition: all 0.2s ease;
      outline: none;
    }

    input:focus, select:focus {
      border-color: var(--primary);
      background-color: #ffffff;
      box-shadow: 0 0 0 4px var(--focus-ring);
    }

    input[readonly], select[disabled] {
      background-color: #f1f5f9;
      color: #64748b;
      cursor: not-allowed;
    }

    .hidden {
      display: none !important;
    }

    .btn-submit {
      width: 100%;
      background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
      color: white;
      border: none;
      padding: 15px;
      font-size: 15px;
      font-weight: 700;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
      margin-top: 10px;
    }

    .btn-submit:disabled {
      background: #cbd5e1;
      box-shadow: none;
      cursor: not-allowed;
    }

    /* PANTALLA DE BLOQUEO Y ÉXITO */
    .blocked-screen {
      text-align: center;
      padding: 40px 20px;
    }

    .blocked-icon {
      font-size: 54px;
      margin-bottom: 15px;
    }

    .blocked-screen h3 {
      font-size: 20px;
      color: #1e293b;
      margin-bottom: 10px;
      font-weight: 800;
    }

    .blocked-screen p {
      font-size: 14px;
      color: #64748b;
      line-height: 1.5;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="card-header">
      <h2>📦 Datos de Entrega</h2>
      <p id="subtitulo-header">Confirma tus datos para procesar el envío</p>
    </div>

    <div class="card-body">
      
      <!-- PANTALLA BLOQUEADA (INICIALMENTE OCULTA) -->
      <div id="pantalla-bloqueada" class="blocked-screen hidden">
        <div class="blocked-icon">✅</div>
        <h3>¡Envío Registrado Exitosamente!</h3>
        <p>Tus datos han sido guardados correctamente y el formulario ha sido bloqueado.</p>
        <p style="margin-top: 12px; font-size: 12px; color: #94a3b8;">Si necesitas modificar algo, solicita un nuevo enlace de confirmación.</p>
      </div>

      <!-- FORMULARIO DE REGISTRO -->
      <form id="form-registro">
        <div class="form-group">
          <label for="celular">Celular de Contacto</label>
          <input type="text" id="celular" name="celular" readonly placeholder="Cargando...">
        </div>

        <div class="form-group">
          <label for="dni">DNI / Carnet de Extranjería</label>
          <input type="text" id="dni" name="dni" placeholder="Ingrese su documento" required>
        </div>

        <div class="form-group">
          <label for="nombre">Apellidos y Nombres</label>
          <input type="text" id="nombre" name="nombre" placeholder="Ingrese su nombre completo" required>
        </div>

        <div class="form-group">
          <label for="departamento">Departamento</label>
          <select id="departamento" name="departamento" required>
            <option value="">Seleccione Departamento</option>
          </select>
        </div>

        <div class="form-group">
          <label for="provincia">Provincia</label>
          <select id="provincia" name="provincia" required>
            <option value="">Seleccione Provincia</option>
          </select>
        </div>

        <div class="form-group">
          <label for="distrito">Distrito</label>
          <select id="distrito" name="distrito" required>
            <option value="">Seleccione Distrito</option>
          </select>
        </div>

        <div class="form-group">
          <label for="tipo_entrega">Tipo de Entrega</label>
          <select id="tipo_entrega" name="tipo_entrega" required>
            <option value="">Seleccione Tipo</option>
          </select>
        </div>

        <div id="wrapper-agencia" class="form-group hidden">
          <label for="agencia">Agencia de Envío</label>
          <select id="agencia" name="agencia">
            <option value="">Seleccione Agencia</option>
            <option value="Shalom">Shalom</option>
            <option value="Olva">Olva Courier</option>
            <option value="Otros">Otra Agencia</option>
          </select>
        </div>

        <div id="wrapper-agencia-otra" class="form-group hidden">
          <label for="agencia_otra">Nombre de la Agencia</label>
          <input type="text" id="agencia_otra" placeholder="Escriba el nombre de la agencia">
        </div>

        <div id="wrapper-sede-select" class="form-group hidden">
          <label for="sede_select">Sede Shalom</label>
          <select id="sede_select">
            <option value="">Seleccione Sede</option>
          </select>
        </div>

        <div id="wrapper-sede-manual" class="form-group">
          <label id="label-sede-manual" for="direccion_manual">Sede / Dirección</label>
          <input type="text" id="direccion_manual" placeholder="Ingrese dirección o sede de entrega">
        </div>

        <button type="submit" id="btn-guardar" class="btn-submit">Confirmar y Guardar Datos</button>
      </form>
    </div>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbw3L8PHJ4teJL1aOvpGNdFBnz_STLvwXjuLQaAV2tFl-Jy1tVI-RbRc5th2SbP7eAqQog/exec";

    let dbUbigeo = [];
    let dbClientes = [];
    let dbShalom = [];
    let currentToken = "";

    function normalizarTexto(txt) {
      if (!txt) return "";
      return String(txt).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim();
    }

    function normalizarTelefono(num) {
      if (!num) return "";
      const soloDigitos = String(num).replace(/\D/g, "");
      return soloDigitos.length >= 9 ? soloDigitos.slice(-9) : soloDigitos;
    }

    function obtenerDatosDesdeToken() {
      const urlParams = new URLSearchParams(window.location.search);
      const token = urlParams.get('token');
      if (!token) return { celular: "", tokenID: "" };
      
      currentToken = token; // Identificador único de este link
      try {
        const rawData = atob(token);
        const partes = rawData.split('_');
        const celularLimpio = partes[0].replace(/\D/g, "");
        return {
          celular: celularLimpio.length >= 9 ? celularLimpio.slice(-9) : celularLimpio,
          tokenID: token
        };
      } catch (e) {
        return { celular: "", tokenID: token };
      }
    }

    function verificarSiEstaBloqueado(tokenID) {
      if (!tokenID) return false;
      return localStorage.getItem("completado_" + tokenID) === "true";
    }

    function bloquearFormulario() {
      document.getElementById("form-registro").classList.add("hidden");
      document.getElementById("pantalla-bloqueada").classList.remove("hidden");
      document.getElementById("subtitulo-header").textContent = "Registro completado";
    }

    async function cargarBaseDatos() {
      try {
        const res = await fetch(API_URL, { method: "GET", redirect: "follow" });
        const data = await res.json();
        dbUbigeo = data.ubigeo || [];
        dbClientes = data.clientes || [];
        dbShalom = data.shalom || [];

        poblarDepartamentos();
      } catch (err) {
        console.error("Error al cargar datos:", err);
      }
    }

    function poblarDepartamentos() {
      const selDep = document.getElementById("departamento");
      const departamentos = [...new Set(
        dbUbigeo
          .map(item => String(item.departamento || item.DEPARTAMENTO || "").trim())
          .filter(dep => dep !== "" && !dep.toUpperCase().includes("DEPARTAMEN"))
      )].sort();

      let html = '<option value="">Seleccione Departamento</option>';
      departamentos.forEach(dep => html += `<option value="${dep}">${dep}</option>`);
      selDep.innerHTML = html;
    }

    function poblarProvincias(depSeleccionado) {
      const selProv = document.getElementById("provincia");
      const selDist = document.getElementById("distrito");
      selProv.innerHTML = '<option value="">Seleccione Provincia</option>';
      selDist.innerHTML = '<option value="">Seleccione Distrito</option>';
      if (!depSeleccionado) return;

      const provincias = [...new Set(
        dbUbigeo
          .filter(item => normalizarTexto(item.departamento || item.DEPARTAMENTO) === normalizarTexto(depSeleccionado))
          .map(item => String(item.provincia || item.PROVINCIA || "").trim())
          .filter(p => p !== "" && p.toUpperCase() !== "PROVINCIA")
      )].sort();

      let html = '<option value="">Seleccione Provincia</option>';
      provincias.forEach(p => html += `<option value="${p}">${p}</option>`);
      selProv.innerHTML = html;
    }

    function poblarDistritos(depSeleccionado, provSeleccionada) {
      const selDist = document.getElementById("distrito");
      selDist.innerHTML = '<option value="">Seleccione Distrito</option>';
      if (!depSeleccionado || !provSeleccionada) return;

      const distritos = [...new Set(
        dbUbigeo
          .filter(item => {
            const d = item.departamento || item.DEPARTAMENTO || "";
            const p = item.provincia || item.PROVINCIA || "";
            return normalizarTexto(d) === normalizarTexto(depSeleccionado) && normalizarTexto(p) === normalizarTexto(provSeleccionada);
          })
          .map(item => String(item.distrito || item.DISTRITO || "").trim())
          .filter(dist => dist !== "" && dist.toUpperCase() !== "DISTRITO")
      )].sort();

      let html = '<option value="">Seleccione Distrito</option>';
      distritos.forEach(dist => html += `<option value="${dist}">${dist}</option>`);
      selDist.innerHTML = html;
    }

    function evaluarReglasDistrito() {
      const distrito = document.getElementById("distrito").value;
      const distNorm = normalizarTexto(distrito);
      const selTipo = document.getElementById("tipo_entrega");
      const wrapperAgencia = document.getElementById("wrapper-agencia");

      if (distNorm === "chimbote" || distNorm === "nuevo chimbote") {
        selTipo.innerHTML = `
          <option value="">Seleccione Tipo</option>
          <option value="Recojo en local">Recojo en local</option>
          <option value="Delivery">Delivery</option>
        `;
        wrapperAgencia.classList.add("hidden");
        document.getElementById("agencia").value = "";
        evaluarReglasAgencia();
      } else if (distNorm !== "") {
        selTipo.innerHTML = `<option value="Agencia">Agencia</option>`;
        selTipo.value = "Agencia";
        wrapperAgencia.classList.remove("hidden");
        evaluarReglasAgencia();
      } else {
        selTipo.innerHTML = '<option value="">Seleccione Tipo</option>';
        wrapperAgencia.classList.add("hidden");
        evaluarReglasAgencia();
      }
    }

    function evaluarReglasAgencia() {
      const agencia = document.getElementById("agencia").value;
      const distrito = document.getElementById("distrito").value;

      const wrapperOtra = document.getElementById("wrapper-agencia-otra");
      const wrapperSelectSede = document.getElementById("wrapper-sede-select");
      const wrapperManualSede = document.getElementById("wrapper-sede-manual");
      const labelManual = document.getElementById("label-sede-manual");

      if (agencia === "Otros") {
        wrapperOtra.classList.remove("hidden");
      } else {
        wrapperOtra.classList.add("hidden");
        document.getElementById("agencia_otra").value = "";
      }

      if (agencia === "Shalom") {
        wrapperSelectSede.classList.remove("hidden");
        wrapperManualSede.classList.add("hidden");
        poblarSedesShalom(distrito);
      } else {
        wrapperSelectSede.classList.add("hidden");
        wrapperManualSede.classList.remove("hidden");
        labelManual.textContent = agencia === "Olva" ? "Dirección / Sede de Olva" : "Dirección de Entrega";
      }
    }

    function poblarSedesShalom(distrito) {
      const selSede = document.getElementById("sede_select");
      if (!distrito) {
        selSede.innerHTML = '<option value="Sin sede registrada">Sin sede registrada</option>';
        return;
      }

      const distNorm = normalizarTexto(distrito);
      const sedes = dbShalom.filter(item => {
        const distSheet = item.DISTRITO || item.distrito || "";
        return normalizarTexto(distSheet) === distNorm;
      }).map(item => String(item.SEDE || item.sede || "").trim()).filter(s => s !== "");

      if (sedes.length > 0) {
        let html = '<option value="">Seleccione Sede Shalom</option>';
        sedes.forEach(s => html += `<option value="${s}">${s}</option>`);
        selSede.innerHTML = html;
      } else {
        selSede.innerHTML = '<option value="Sin sede registrada">Sin sede registrada</option>';
      }
    }

    function autocompletarCliente(celular) {
      if (!celular || dbClientes.length === 0) return;
      const celBuscado = normalizarTelefono(celular);

      const cliente = dbClientes.find(c => {
        let tel = "";
        Object.keys(c).forEach(k => {
          if (k.toLowerCase().includes("tel") || k.toLowerCase().includes("cel")) tel = c[k];
        });
        return normalizarTelefono(tel) === celBuscado;
      });

      if (cliente) {
        Object.keys(cliente).forEach(k => {
          const key = normalizarTexto(k);
          const val = cliente[k];
          if (key.includes("dni")) document.getElementById("dni").value = val;
          if (key.includes("nom")) document.getElementById("nombre").value = val;
          if (key.includes("dep")) {
            document.getElementById("departamento").value = val;
            poblarProvincias(val);
          }
          if (key.includes("prov")) {
            document.getElementById("provincia").value = val;
            poblarDistritos(document.getElementById("departamento").value, val);
          }
          if (key.includes("dist")) {
            document.getElementById("distrito").value = val;
            evaluarReglasDistrito();
          }
        });
      }
    }

    async function guardarFormulario(e) {
      e.preventDefault();
      const btn = document.getElementById("btn-guardar");
      btn.disabled = true;
      btn.textContent = "⏳ Guardando...";

      const agenciaSel = document.getElementById("agencia").value;
      const agenciaFinal = agenciaSel === "Otros" 
        ? document.getElementById("agencia_otra").value 
        : agenciaSel;

      let sedeFinal = "";
      if (agenciaSel === "Shalom") {
        sedeFinal = document.getElementById("sede_select").value;
      } else {
        sedeFinal = document.getElementById("direccion_manual").value;
      }

      const payload = {
        telefono: document.getElementById("celular").value,
        dni: document.getElementById("dni").value,
        nombre: document.getElementById("nombre").value,
        departamento: document.getElementById("departamento").value,
        provincia: document.getElementById("provincia").value,
        distrito: document.getElementById("distrito").value,
        tipoEntrega: document.getElementById("tipo_entrega").value,
        agencia: agenciaFinal,
        direccionSede: sedeFinal
      };

      try {
        await fetch(API_URL, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(payload)
        });

        // Marcar este link/token como consumido para bloquearlo
        if (currentToken) {
          localStorage.setItem("completado_" + currentToken, "true");
        }

        // Mostrar pantalla de bloqueo y éxito
        bloquearFormulario();

      } catch (err) {
        alert("Ocurrió un error al guardar los datos.");
        btn.disabled = false;
        btn.textContent = "Confirmar y Guardar Datos";
      }
    }

    document.addEventListener("DOMContentLoaded", async () => {
      const datosToken = obtenerDatosDesdeToken();
      document.getElementById("celular").value = datosToken.celular;

      // Si este token ya se usó para guardar, bloquear de inmediato
      if (verificarSiEstaBloqueado(datosToken.tokenID)) {
        bloquearFormulario();
        return;
      }

      document.getElementById("departamento").addEventListener("change", (e) => poblarProvincias(e.target.value));
      document.getElementById("provincia").addEventListener("change", (e) => poblarDistritos(document.getElementById("departamento").value, e.target.value));
      document.getElementById("distrito").addEventListener("change", evaluarReglasDistrito);
      document.getElementById("agencia").addEventListener("change", evaluarReglasAgencia);
      document.getElementById("form-registro").addEventListener("submit", guardarFormulario);

      await cargarBaseDatos();
      if (datosToken.celular) autocompletarCliente(datosToken.celular);
    });
  </script>
</body>
</html>
